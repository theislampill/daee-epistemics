name: Build Skill Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release-line version for the artifact name, including leading v"
        required: true
        default: "v0.4.0.0"

permissions:
  contents: read

jobs:
  build-skill-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checker dependencies
        run: python -m pip install --upgrade pip PyYAML

      - name: Normalize version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like v0.4.0.0" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CONTRACT_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build and verify runtime
        run: |
          python tools/build_framework_pipeline.py
          python tools/build_compiled_runtime.py
          python tools/check_compiled_runtime_freshness.py
          python tools/check_package_shape.py
          python tools/check_compiled_module_boundaries.py
          python tools/check_stub_integrity.py
          python tools/check_consolidation_call_budget.py
          python tools/check_routing_parity.py
          python tools/check_routing_parity.py --strict
          python tools/check_recursive_traversal_governance.py
          python tools/check_render_modes.py
          python tools/check_frontmatter.py --contract-version "$CONTRACT_VERSION"
          python tools/check_coverage.py
          python tools/check_framework_pipeline.py
          python tools/check_recursion_collapse_noetic_frame.py
          python tools/check_metacompliance_current_canon.py
          python tools/check_smoke_artifacts.py
          python tools/check_register_formalism_bridge.py
          python tools/check_ir_instance_integrity.py
          python tools/check_diagnostic_ir_catalogue_integrity.py
          python tools/check_encoding_hygiene.py
          python -m py_compile tools/*.py
          git diff --exit-code -- atomics/skill/references/diagnostics/framework-pipeline.md skill/
          git diff --check

      - name: Build package artifact
        shell: bash
        run: |
          mkdir -p build
          python tools/package_skill.py "build/daee-epistemics-${VERSION}.skill.zip"
          cp "build/daee-epistemics-${VERSION}.skill.zip" "build/daee-epistemics-${VERSION}.skill"

      - name: Write package provenance
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from zipfile import ZipFile

          version = os.environ["VERSION"]
          contract_version = os.environ["CONTRACT_VERSION"]
          zip_path = Path(f"build/daee-epistemics-{version}.skill.zip")
          asset_path = Path(f"build/daee-epistemics-{version}.skill")
          provenance_path = Path(f"build/daee-epistemics-{version}.provenance.json")

          required_roots = {
              "SKILL.md",
              "README.md",
              "references",
              "compiled-module-map.json",
              "build-manifest.json",
          }
          forbidden_roots = {
              "skill",
              "atomics",
              "tools",
              "docs",
              "build",
              ".git",
              "data",
              "scripts",
              "tests",
          }

          with ZipFile(zip_path) as zf:
              names = zf.namelist()

          top_level = sorted({name.split("/", 1)[0] for name in names if name})
          missing = sorted(required_roots - set(top_level))
          forbidden = sorted(forbidden_roots.intersection(top_level))
          if missing:
              raise SystemExit(f"archive missing required root entries: {', '.join(missing)}")
          if forbidden:
              raise SystemExit(f"archive contains forbidden root entries: {', '.join(forbidden)}")

          zip_bytes = zip_path.read_bytes()
          asset_bytes = asset_path.read_bytes()
          source_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()

          payload = {
              "version": version,
              "contract_version": contract_version,
              "source_commit": source_commit,
              "zip_path": str(zip_path),
              "asset_path": str(asset_path),
              "zip_sha256": hashlib.sha256(zip_bytes).hexdigest().upper(),
              "asset_sha256": hashlib.sha256(asset_bytes).hexdigest().upper(),
              "zip_size": len(zip_bytes),
              "asset_size": len(asset_bytes),
              "entry_count": len(names),
              "top_level_entries": top_level,
              "required_roots": sorted(required_roots),
              "forbidden_roots_absent": forbidden == [],
              "github_release_published": False,
          }
          provenance_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: daee-epistemics-${{ env.VERSION }}-skill
          path: |
            build/daee-epistemics-${{ env.VERSION }}.skill
            build/daee-epistemics-${{ env.VERSION }}.skill.zip
            build/daee-epistemics-${{ env.VERSION }}.provenance.json
          if-no-files-found: error

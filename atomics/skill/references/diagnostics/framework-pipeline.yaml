transitions:
  - state: STOP
    owner: skill/references/diagnostics/recursive-state-transitions.md
    condition: no eligible live burden remains after state re-read, no held route became eligible, and P7 permits stopping
    support_claim: stop_hold_recurse_partial
  - state: HOLD
    owner: skill/references/diagnostics/recursive-state-transitions.md
    condition: remaining material exists but its release signal is absent or a hard rail still blocks it
    support_claim: stop_hold_recurse_partial
  - state: RECURSE
    owner: skill/references/diagnostics/recursive-state-transitions.md
    condition: another same-input live burden remains or a held route becomes newly eligible after the current blocker clears
    support_claim: stop_hold_recurse_partial
  - state: PARTIAL
    owner: skill/references/diagnostics/recursive-state-transitions.md
    condition: limits prevent completion while recursive pressure remains
    support_claim: stop_hold_recurse_partial

pass_shape:
  owner: skill/references/rubrics/diagnostic-render-contract.md
  sequence:
    - Layer A
    - Layer B
    - state re-read
  recurse_repeats: true
  release_checks:
    - Layer A identifies live burden without route ledger
    - Layer B answers only permitted current live burden and operative submoves
    - state re-read decides next transition
    - topical components remain submoves until re-read licenses a new burden
  support_claim: layer_a_layer_b_state_refresh

ttp_execution:
  owner: skill/references/diagnostics/recursive-state-transitions.md
  sequence:
    - target
    - operation
    - result
    - state re-read
  entry_criteria:
    - validated IR exists
    - owner-backed selection
    - bounded target
    - release permission
  exit_criteria:
    - result
    - state delta
    - held-route recheck
  depth_guards:
    - no depth increase without burden landing and state re-read
    - no depth increase for next operative submove under same burden
    - no depth increase for hiddenness/punishment/source-status when subordinate to same burden
    - no repeated operator without refreshed warrant
    - PARTIAL when limits block next eligible burden
  support_claim: ttp_target_operation_result_refresh


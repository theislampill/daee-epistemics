schema_version: 1

scope:
  owns:
    - structured control-plane map for the generated framework-pipeline ASCII chart
    - generated chart node order, edge index, gate index, shortcut index, and owner index
  does_not_own:
    - doctrinal content
    - runtime route creation
    - PF codes, IR fields, or module activation rules
    - concrete STOP semantics beyond indexing the recursive-state owner

generated_region:
  begin: "<!-- BEGIN GENERATED FRAMEWORK PIPELINE -->"
  end: "<!-- END GENERATED FRAMEWORK PIPELINE -->"

nodes:
  - id: user_input
    label: USER INPUT / D0 / CLAIM / EXCERPT
    owner: skill/references/diagnostics/framework-pipeline.md
    lines:
      - D0 / surface-discourse intake only; not a route
      - not a deterministic argument bank key
    support_claim: framework_pipeline_audit_surface

  - id: always_load
    label: ALWAYS-LOAD BACKGROUND
    owner: skill/SKILL.md
    lines:
      - terminology.md | case-library/INDEX.md
      - module-codes.md | heuristics.md
    support_claim: always_load_background

  - id: v1_diagnostic_gate
    label: V1 DIAGNOSTIC GATE
    owner: skill/references/techniques/V1-diagnostic.md
    lines:
      - diagnosis before answer
      - no module before case-state
      - listen -> classify -> form IR -> dispatch
    support_claim: diagnosis_before_answer

  - id: phase1_listening
    label: "PHASE 1: LISTENING"
    owner: skill/references/diagnostics/noetic-reading-checklist.md
    lines:
      - map noetic structure
      - track anchor / warrant / affective weight
      - do not answer yet
    support_claim: noetic_read_before_response

  - id: phase2_mandatory_passes
    label: "DIAGNOSTIC REDUCTION - PHASE 2 AXES + MANDATORY PASSES"
    owner: skill/SKILL.md
    lines:
      - core axes emit case-state features before route selection
      - mandatory passes run inside the diagnostic gate
      - overlays / specialty markers checked before dispatch
      - no route itinerary before diagnostic reduction completes
    mandatory_passes:
      - label: "[P-A]"
        file: skill/references/diagnostics/reason-disambiguation.md
        emits: reason-category (1-4) + routing gate
      - label: "[P-B]"
        file: skill/references/diagnostics/foreign-premise-detection.md
        emits: Foreign Premise Detection result
      - label: "[P-C]"
        file: skill/references/diagnostics/prophetic-discourse-neutralization.md
        emits: semantic-neutralization mode or none active
      - label: "[P-D]"
        file: skill/references/diagnostics/arabic-backbone-predicates.md
        emits: active predicates or none active
    support_claim: mandatory_phase2_passes

  - id: diagnostic_ir
    label: DIAGNOSTIC IR - FORMATION + DISPATCH GATE
    owner: skill/references/diagnostics/diagnostic-ir.md
    lines:
      - compose IR from Phase 2 outputs
      - validated IR is runtime compiler state
      - IR before routing
      - schema-light register bridge maps D0 -> PsiN -> IR without hard schema fields
      - Baseline register formalism is schema-light, not optional or future parity
      - module dispatch blocked until all gate checks pass
    support_claim: runtime_diagnostic_compiler

  - id: selected_held_registers
    label: SELECTED/HELD N + LIVE REGISTERS
    owner: skill/references/rubrics/output-release.md
    lines:
      - selected/held noetic frames remain live control state
      - live heart, xi, Omega, sigma, mu, kappa affect release or stay unprinted
      - remaining kappa / H status must be recoverable before closure
    support_claim: selected_held_registers

  - id: gate_blocked
    label: GATE BLOCKED
    owner: skill/references/diagnostics/diagnostic-ir.md
    lines:
      - P7 stops, semantic blockers, or register holds block/compress Layer B
      - Layer A stays live
    support_claim: gate_blocked_semantics

  - id: gate_open
    label: GATE OPEN
    owner: skill/references/diagnostics/routing-precedence.md
    lines:
      - gate checks passed; routing precedence may now run
      - route cleared for one current live burden
    support_claim: routing_before_render

  - id: routing_precedence
    label: ROUTING PRECEDENCE
    owner: skill/references/diagnostics/routing-precedence.md
    lines:
      - levels 1-10 applied after gate checks
      - upstream blocker before downstream topic
      - route chain is not bounded operator
      - TTP entry before activation
    support_claim: routing_before_render

  - id: selected_live_burden
    label: SELECTED CURRENT LIVE BURDEN
    owner: skill/references/rubrics/diagnostic-render-contract.md
    lines:
      - one live noetic burden/function selected
      - broad enough to contain justified operative submove sequence
      - current bounded operator is not a route chain
      - "invalid: FPD -> M1 -> DO-8 -> M8 -> restoration"
      - "invalid split: imported criterion / hujjah / hiddenness as three burden-cycles before same-function or new-burden proof"
      - "invalid split: imported tribunal / hiddenness / punishment / named source-worldview as serial burden-cycles without re-read proof"
      - not deterministic argument-bank selection
    support_claim: selected_live_burden_operator

  - id: operative_submoves
    label: OPERATIVE SUBMOVE(S)
    owner: skill/references/diagnostics/recursive-state-transitions.md
    lines:
      - inside selected live burden only
      - "entry criteria: validated IR + owner + bounded target"
      - target -> operation -> result
      - "ⁿBᵢ[OP] : target -> operation -> result -> ΔⁿB{♥,ξ,Ω,σ,μ} / Δκ"
      - derived registers may change state delta / collapse radius when live
      - hujjah/accountability can be operative submove only after same-function proof
      - guidance-as-coercive-proof can be operative submove only after same-function proof
      - hiddenness/punishment/source-status can be operative submoves under one burden only after same-function proof
      - distinct input-anchored noetic functions require next burden, HOLD, or PARTIAL
      - "exit criteria: result + state delta + held-route recheck"
      - operative submoves do not count as recursion
    support_claim: ttp_entry_exit_criteria

  - id: delta_transition
    label: DELTA-NB / DELTA-KAPPA TRANSITION
    owner: skill/references/diagnostics/recursive-state-transitions.md
    lines:
      - Delta-nB is event-local burden-state change
      - Delta-kappa is event-local dependency/collapse-radius change
      - deltas feed Land(B) -> R(H,Delta), not decorative notation
    support_claim: delta_transition_boundary

  - id: burden_result
    label: BURDEN LANDED
    owner: skill/references/diagnostics/recursive-state-transitions.md
    lines:
      - selected burden lands or remains held
      - burden landing precedes state re-read
      - Delta-nB remains local; n-plus-1B requires re-read license
      - state re-read waits for whole burden, not each operative submove
      - depth/stop guards checked before next pass
      - restoration/pastoral waits for refresh license
    support_claim: depth_stop_guards

  - id: output_governance
    label: OUTPUT GOVERNANCE
    owner: skill/SKILL.md
    lines:
      - default visible Layer A stays compact DSL/IR / fit-for-purpose
      - bounded Layer B only if gate permits
      - Layer A / Layer B release checks
      - no raw IR / full Case State / matched_modules dump in default
    support_claim: layer_ab_release_checks

  - id: output_release
    label: OUTPUT-RELEASE RUBRIC
    owner: skill/references/rubrics/output-release.md
    lines:
      - release amount, order, held material, and recursive traversal checked
      - live registers alter release behavior or stay unprinted
      - output-release before visible response
    support_claim: output_release_before_render

  - id: render_contract
    label: DIAGNOSTIC RENDER CONTRACT
    owner: skill/references/rubrics/diagnostic-render-contract.md
    lines:
      - Level 1 default compact DSL/IR header plus bounded governed response
      - Level 2 compact DSL / lab-report
      - legacy internal/development audit compatibility is not current render doctrine
      - expanded notation is forbidden as decorative proof of execution
      - diagnostic-render-contract before final shape
    support_claim: render_contract_before_final_shape

  - id: noetic_field_banner
    label: NOETIC-FIELD BANNER OBLIGATION
    owner: skill/references/rubrics/diagnostic-render-contract.md
    lines:
      - mandatory noetic-field execution banner is first visible output
      - produced from same classification state as Layer A
      - not a substitute for diagnostic reduction or owner execution
    support_claim: noetic_field_banner_default

  - id: pass_shape
    label: "LAYER A -> LAYER B -> STATE RE-READ"
    owner: skill/references/rubrics/diagnostic-render-contract.md
    lines:
      - one burden-cycle = one live burden -> Layer A -> Layer B -> state re-read
      - one burden-cycle may contain multiple operative submoves
      - RECURSE repeats the burden-cycle shape
      - recursion goes through state re-read, not topic transition
      - multi-burden does not mean multi-recursion by default
    support_claim: layer_a_layer_b_state_refresh

  - id: bounded_layer_b
    label: BOUNDED LAYER B OPERATION
    owner: skill/references/rubrics/output-release.md
    lines:
      - answers only the permitted current live burden
      - held material remains held until R(H,Delta) licenses release
      - active submoves preserve target -> operation -> result
    support_claim: bounded_layer_b_release

  - id: restoration_trace
    label: RESTORATION TRACE
    owner: skill/references/rubrics/diagnostic-render-contract.md
    lines:
      - governing misread risk
      - what was withheld and why
      - correction applied and what remains live
    support_claim: restoration_trace_shape

  - id: post_render_gate
    label: R(H,Delta) RECONSTRUCTION / RE-ENTRY GATE
    owner: skill/references/diagnostics/recursive-state-transitions.md
    lines:
      - state re-read asks what cleared and what remains live
      - reconstruct selected/held N, live registers, burden deltas, kappa, and H
      - held routes rechecked
      - Delta-kappa dependency-radius changes are consumed before closure
      - convergence through controlled state transitions
      - decision = STOP / HOLD / RECURSE / PARTIAL
    support_claim: post_render_gate_before_closure

  - id: bottom_line
    label: BOTTOM-LINE SYNTHESIS / NEXT MOVE
    owner: skill/SKILL.md
    lines:
      - conclusion relative to restored order
      - one actionable next move
      - stop only after the post-render gate permits closure
    support_claim: bottom_line_closure

required_order:
  - user_input
  - always_load
  - v1_diagnostic_gate
  - phase1_listening
  - phase2_mandatory_passes
  - diagnostic_ir
  - selected_held_registers
  - gate_blocked
  - gate_open

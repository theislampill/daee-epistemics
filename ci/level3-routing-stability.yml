# Deprecated template only: this file is not active GitHub Actions CI unless copied under
# .github/workflows/. Do not promote it as-is. The legacy-named Level 3 harness is
# optional route/check machinery, not the active push/PR workflow or package smoke path.

name: Deprecated Level 3 routing stability template

on:
  push:
  pull_request:

jobs:
  level3-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install checker dependencies
        run: python -m pip install --upgrade pip PyYAML
      - name: Build generated skill
        run: |
          python tools/build_framework_pipeline.py
          python tools/build_compiled_runtime.py
          python tools/check_compiled_runtime_freshness.py
          python tools/check_level3_data_shapes.py --include-generated
          python tools/check_package_shape.py
      - name: Run Level 3 stability check
        run: python skill/scripts/daee_level3.py --run-fixtures --simulate-output --repeat-stability 5 --fail-on-partial --output-dir build/level3-stability
